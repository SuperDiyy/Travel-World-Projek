<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif; /* Sesuai dengan font style.css kamu */
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box-login {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }

        .box-login h2 {
            text-align: center;
            color: #212529;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-grup {
            margin-bottom: 15px;
        }

        .form-grup label {
            display: block;
            margin-bottom: 5px;
            color: #212529;
            font-weight: bold;
            font-size: 14px;
        }

        .form-grup input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-grup input:focus {
            outline: none;
            border-color: #2261b9; /* Disamakan dengan warna header index.html kamu */
        }

        .btn-login {
            width: 100%;
            background-color: #2261b9; /* Memakai warna biru bawaan web kamu */
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #1a4a8d;
        }

        .pesan-error {
            color: #ff0055;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="box-login">
        <h2>Login Akun Caihin-Travel</h2>
        
        <form id="formLogin">
            <div class="form-grup">
                <label>Email</label>
                <input type="email" id="inputEmail" placeholder="Masukkan Email..." required>
            </div>
            
            <div class="form-grup">
                <label>Password</label>
                <input type="password" id="inputPassword" placeholder="Masukkan Password..." required>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
            
            <p id="errorText" class="pesan-error">Email atau password yang Anda masukkan salah!</p>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            var email = document.getElementById('inputEmail').value;
            var password = document.getElementById('inputPassword').value;
            var errorText = document.getElementById('errorText');

            var emailBenar = "cinnob@gmail.com";
            var passwordBenar = "athuibau";

            if (email === emailBenar && password === passwordBenar) {
                errorText.style.display = 'none';
                window.location.href = 'index.html'; 
            } else {
                errorText.style.display = 'block';
            }
        });
    </script>

</body>
</html>
